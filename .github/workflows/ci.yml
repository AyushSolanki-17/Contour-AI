name: Continuous integration

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install Python
        run: uv python install 3.14
      - name: Install locked environment
        run: uv sync --locked --group dev
      - name: Run Python quality checks
        run: make quality
      - name: Validate documentation links
        run: make docs

  persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      database:
        image: postgres:17.2-alpine3.21
        env:
          POSTGRES_DB: contour_ci
          POSTGRES_USER: contour_ci
          POSTGRES_PASSWORD: contour-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contour_ci -d contour_ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      CONTOUR_POSTGRES_DB: contour_ci
      CONTOUR_POSTGRES_USER: contour_ci
      CONTOUR_POSTGRES_PASSWORD: contour-ci-only
      CONTOUR_POSTGRES_HOST: 127.0.0.1
      CONTOUR_POSTGRES_PORT: 5432
      # Test-only signing material keeps integration settings validation aligned
      # with the production requirement without exposing a production secret.
      CONTOUR_CURSOR_SIGNING_SECRET: contour-ci-cursor-signing-only
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install Python
        run: uv python install 3.14
      - name: Install locked environment
        run: uv sync --locked --group dev
      - name: Verify migrations and PostgreSQL persistence
        run: make test-integration

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
