[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "contour"
version = "0.0.1"
description = "Evidence-backed knowledge and investigation backend"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.19,<2",
    "pre-commit>=4.5,<5",
    "pytest>=9.0,<10",
    "ruff>=0.15,<0.16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/contour"]

[tool.mypy]
files = ["src"]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
